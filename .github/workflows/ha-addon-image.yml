name: Build Home Assistant add-on image

# Runs when the add-on version is bumped on main, or manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - homeassistant/immich_kiosk/config.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version and image from add-on config
        run: |
          CONFIG=homeassistant/immich_kiosk/config.yaml
          VERSION=$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' "$CONFIG")
          CONFIG_IMAGE=$(sed -nE 's/^image:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' "$CONFIG")
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/immich-kiosk"
          if [ "$CONFIG_IMAGE" != "$IMAGE" ]; then
            echo "::error::image in $CONFIG is '$CONFIG_IMAGE' but this workflow pushes '$IMAGE'. Fix the image line (lowercase username)."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Build and push image
        run: |
          docker buildx build \
            --build-arg VERSION="$VERSION" \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.version=$VERSION" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            --push .
