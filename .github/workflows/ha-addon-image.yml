name: Build Home Assistant add-on image

# Runs when the add-on version is bumped on main, manually from the Actions tab,
# or from sync-upstream.yml after it merges a new upstream release.
on:
  push:
    branches: [main]
    paths:
      - homeassistant/immich_kiosk/config.yaml
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch or commit to build
        type: string
        default: main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version and image from add-on config
        run: |
          CONFIG=homeassistant/immich_kiosk/config.yaml
          VERSION=$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' "$CONFIG")
          CONFIG_IMAGE=$(sed -nE 's/^image:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' "$CONFIG")
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/immich-kiosk"
          if [ "$CONFIG_IMAGE" != "$IMAGE" ]; then
            echo "::error::image in $CONFIG is '$CONFIG_IMAGE' but this workflow pushes '$IMAGE'. Fix the image line (lowercase username)."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Compiles Kiosk with the root Dockerfile, then adds the HA wrapper on top.
      - name: Build and push image
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: docker buildx bake -f homeassistant/immich_kiosk/docker-bake.hcl --push addon
